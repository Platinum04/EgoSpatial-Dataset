name: android-xr
on:
  push:
    paths: ["android-xr/**", ".github/workflows/android-xr.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-xr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Unit tests (engine + app logic)
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: egospatial-xr-debug-apk
          path: android-xr/app/build/outputs/apk/debug/*.apk
