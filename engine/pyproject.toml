[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egospatial"
version = "1.0.1"
description = "Portable spatial reasoning engine for XR: deterministic egocentric geometry + optional Gemma semantic parsing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
neural = ["torch>=2.1", "transformers>=4.44", "accelerate"]

[project.scripts]
egospatial = "egospatial.__main__:main"
egospatial-server = "egospatial.server:serve"

[tool.setuptools]
packages = ["egospatial"]
